# screen-256color is deprecated
# set -g default-terminal "screen-256color"

set -g default-terminal "tmux-256color"

# Prevent jumping panes when using up arrow to get command from history after chaning panes
bind-key Up    select-pane -U
bind-key Down  select-pane -D
bind-key Left  select-pane -L
bind-key Right select-pane -R

# Add mouse support default
# set -g mouse off

# Keybinding to toggle mouse mode
bind m run "tmux show -g mouse | grep -q on && tmux set -g mouse off || tmux set -g mouse on"

# Set scrollback buffer
set -g history-limit 100000

# Pi agent warning (tmux extended-keys is off)
set -g extended-keys on

# Select previous/next window
bind -n C-Left  previous-window
bind -n C-Right next-window

# Move current window left/right
bind -n S-Left  swap-window -t -1
bind -n S-Right swap-window -t +1
